name: Temporary SOC-IO formatting pass

on:
  push:
    branches:
      - feature/soc-io-proposal
    paths:
      - .github/workflows/soc-io.yml
      - docs/soc-io-production-readiness.md
      - docs/soc-io-proposal.md
      - experiments/soc-io/README.md
      - experiments/soc-io/dashboard.html
      - tests/boundary/cli/keyedArchivePrototypeKeyCli.test.ts

permissions:
  contents: write

concurrency:
  group: soc-io-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposal branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format the six files reported by CI
        run: >-
          npx oxfmt --write
          .github/workflows/soc-io.yml
          docs/soc-io-production-readiness.md
          docs/soc-io-proposal.md
          experiments/soc-io/README.md
          experiments/soc-io/dashboard.html
          tests/boundary/cli/keyedArchivePrototypeKeyCli.test.ts
      - name: Commit formatting changes on the proposal branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "The formatter made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/soc-io.yml docs/soc-io-production-readiness.md docs/soc-io-proposal.md experiments/soc-io/README.md experiments/soc-io/dashboard.html tests/boundary/cli/keyedArchivePrototypeKeyCli.test.ts
          git commit -m "style: format SOC-IO proposal files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
